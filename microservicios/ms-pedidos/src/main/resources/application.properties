spring.application.name=ms-pedidos
server.port=8082

# Base de datos H2 guardada en archivo (carpeta data/): los datos sobreviven al reiniciar el microservicio
spring.datasource.url=jdbc:h2:file:./data/pedidos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 para ver las tablas: http://localhost:8082/h2-console  (JDBC URL: jdbc:h2:file:./data/pedidos)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
