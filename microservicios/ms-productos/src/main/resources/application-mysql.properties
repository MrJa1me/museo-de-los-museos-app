# Perfil MySQL (XAMPP / Laragon / MySQL Workbench). Se activa con:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# La base de datos se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/museo_productos?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
